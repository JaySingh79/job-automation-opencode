services:
  neo4j:
    image: neo4j:5.26-community
    container_name: cocoindex-neo4j

    environment:
      NEO4J_AUTH: neo4j/${GRAPH_DB_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"

    ports:
      - "7474:7474"
      - "7687:7687"

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins

    restart: unless-stoppedne

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins: