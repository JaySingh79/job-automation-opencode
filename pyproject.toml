[project]
name = "firecrawl-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JaySingh79", email = "jays.iitkgp@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cocoindex>=1.0.24",
    "crawl4ai>=0.9.3",
    "google-api-python-client>=2.150.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "instructor>=1.17.0",
    "litellm[google]>=1.102.1",
    "mcp>=1.29.0",
    "neo4j>=6.3.1",
    "neo4j-graphrag>=1.19.0",
    "playwright>=1.63.0",
    "pylint>=4.0.8",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "serpapi",
]

[project.scripts]
firecrawl-test = "firecrawl_test:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
